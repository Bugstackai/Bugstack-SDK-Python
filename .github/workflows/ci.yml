name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Pinned: ubuntu-latest moved to 26.04, which has no Python 3.9, and the
    # package still supports 3.9 (requires-python >= 3.9).
    runs-on: ubuntu-24.04
    strategy:
      # One version failing does not cancel the others, so a run shows every
      # version that is broken.
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src/bugstack --ignore-missing-imports

      - name: Test
        run: pytest -v
