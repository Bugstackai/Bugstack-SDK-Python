[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bugstack"
version = "1.0.0"
description = "Official BugStack SDK for Python — capture, report, and auto-fix production errors."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "BugStack", email = "team@bugstack.dev" },
]
keywords = ["bugstack", "error-tracking", "monitoring", "debugging", "auto-fix"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.95.0"]
flask = ["flask>=2.0.0"]
django = ["django>=3.2"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.20",
    "flask>=2.0",
    "fastapi>=0.95",
    "django>=3.2",
    "httpx>=0.24",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://bugstack.dev"
Documentation = "https://docs.bugstack.dev/sdks/python"
Repository = "https://github.com/MasonBachmann7/bugstack-python"
Issues = "https://github.com/MasonBachmann7/bugstack-python/issues"
Changelog = "https://github.com/MasonBachmann7/bugstack-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/bugstack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
